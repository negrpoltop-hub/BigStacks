name: Build BigStacks

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile and package
        run: mvn -B -ntp -Dmaven.compiler.showWarnings=true -Dmaven.compiler.showDeprecation=true clean package

      - name: Check jar contents
        run: |
          JAR=$(ls target/BigStacks-*.jar | head -n1)
          echo "Jar: $JAR"
          unzip -l "$JAR" | grep -q "plugin.yml" || { echo "plugin.yml missing"; exit 1;
